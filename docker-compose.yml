services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: cookwithvibe
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: cookwithvibe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookwithvibe -d cookwithvibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "3001"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cookwithvibe
      DB_PASS: ${DB_PASS}
      DB_NAME: cookwithvibe
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      UMAMI_USER: ${UMAMI_USER:-admin}
      UMAMI_PASS: ${UMAMI_PASS}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      # Shared AI provider: chatbot, project auto-fill and blog campaigns all
      # go through it. OpenAI is the default; AI_PROVIDER=groq is the temporary
      # rollback path and is the only setting that reads the GROQ_* block below.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-120000}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-3}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      # LEGACY — remove with src/groq/ once OpenAI is validated in production.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      GROQ_CHAT_KEYS: ${GROQ_CHAT_KEYS:-}
      GROQ_PARSE_KEYS: ${GROQ_PARSE_KEYS:-}
      GROQ_DAILY_LIMIT: ${GROQ_DAILY_LIMIT:-1000}
      SENTRY_DSN: ${SENTRY_DSN}
      # AI blog generation — shares OPENAI_API_KEY/OPENAI_MODEL above, with its
      # own queue and scheduler. Defaults keep the feature off, so an instance
      # that never sets these boots exactly as before.
      AI_CONTENT_ENABLED: ${AI_CONTENT_ENABLED:-false}
      AI_DAILY_MAX_PER_CAMPAIGN: ${AI_DAILY_MAX_PER_CAMPAIGN:-100}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
      AI_DEFAULT_INTERVAL_MINUTES: ${AI_DEFAULT_INTERVAL_MINUTES:-20}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      AI_IMAGE_ENABLED: ${AI_IMAGE_ENABLED:-false}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-1536x1024}
      AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY:-medium}
      AI_COST_INPUT_PER_MTOK: ${AI_COST_INPUT_PER_MTOK:-}
      AI_COST_OUTPUT_PER_MTOK: ${AI_COST_OUTPUT_PER_MTOK:-}
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prerender:
    # Pinned to the digest already running in prod (2026-08-04) to close a
    # supply-chain gap flagged in the pentest — bump deliberately, not via :latest.
    image: tvanro/prerender-alpine:7.2.0@sha256:52dc60a435c3508dd63cf558e0d2139e7eae2d59c907da959de450205347485a
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      CACHE_MAXSIZE: "300"
      CACHE_TTL: "86400"
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_UMAMI_URL: ${VITE_UMAMI_URL}
        VITE_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PRERENDER_ORIGIN: ${PRERENDER_ORIGIN:-https://cookwithvibe.com}
    depends_on:
      - backend
      - prerender

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASS}
      POSTGRES_DB: umami
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    # Pinned to the digest already running in prod (2026-08-04); v3.1.0+ dropped
    # the separate postgresql-* tag, image auto-detects DB type from DATABASE_URL.
    image: ghcr.io/umami-software/umami:3.1.0@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASS}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      BASE_PATH: /umami
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  umami_pgdata:
  redisdata:
