<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 220 220" width="220" height="220" fill="none" role="img" aria-label="CookWithVibe">
  <!-- Steam drawn as three waveform ribbons: the "vibe" half of the name.
       Amplitude is constant and the heights step up toward the middle, so the
       group reads as a rhythm rather than as three random curls. Centred on
       the bowl, not on the whole mark, so it looks like it is rising from it. -->
  <g stroke="#c2683f" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M66 130 Q82 116 66 102 Q50 88 66 74" />
    <path d="M102 138 Q118 122 102 106 Q86 90 102 74 Q118 58 102 42" />
    <path d="M138 130 Q154 116 138 102 Q122 88 138 74" />
  </g>
  <!-- Skillet. The bowl is written as explicit cubics rather than an elliptical
       arc: a chord of exactly 2·rx is the degenerate case for A, and renderers
       disagree about how deep to draw it. -->
  <path d="M30 150 H178 V160 C176 196 146 212 104 212 C62 212 32 196 30 160 Z" fill="#b33b62" />
  <!-- Handle, angled up and away so the silhouette stays open. -->
  <path d="M180 154 L218 140" stroke="#b33b62" stroke-width="17" stroke-linecap="round" fill="none" />
</svg>
