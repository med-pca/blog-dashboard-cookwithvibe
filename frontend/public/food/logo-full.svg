<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" fill="none" role="img" aria-label="CookWithVibe">
  <!-- Mark: the logo-mark.svg geometry (viewBox 18 14 220 220) scaled to 140px
       and set on the left. translate compensates for the mark's viewBox origin
       so the two files stay in sync if the mark is ever adjusted. -->
  <g transform="translate(-3.45 21.09) scale(0.63636)">
    <g stroke="#c2683f" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M66 130 Q82 116 66 102 Q50 88 66 74" />
      <path d="M102 138 Q118 122 102 106 Q86 90 102 74 Q118 58 102 42" />
      <path d="M138 130 Q154 116 138 102 Q122 88 138 74" />
    </g>
    <path d="M30 150 H178 V160 C176 196 146 212 104 212 C62 212 32 196 30 160 Z" fill="#b33b62" />
    <path d="M180 154 L218 140" stroke="#b33b62" stroke-width="17" stroke-linecap="round" fill="none" />
  </g>
  <!-- Wordmark. The camel-case seams are carried by colour rather than spacing,
       so the three words stay readable while the name remains one token. -->
  <text x="170" y="128" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="0.5">
    <tspan fill="#b33b62">Cook</tspan><tspan fill="#241a18">With</tspan><tspan fill="#b33b62">Vibe</tspan>
  </text>
</svg>
