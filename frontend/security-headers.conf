add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The googlesyndication / googleadservices / doubleclick / adtrafficquality hosts
# are required by Google AdSense (admin panel -> Ads). They are listed even when
# ads are switched off, because the switch lives in the database rather than in
# this file. Remove them if AdSense is abandoned for good.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://*.googlesyndication.com https://*.googleadservices.com https://*.googletagservices.com https://adservice.google.com https://fundingchoicesmessages.google.com https://*.fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://*.cloudflareinsights.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google https://*.google.com https://fundingchoicesmessages.google.com https://*.fundingchoicesmessages.google.com; frame-src https://maps.google.com https://www.google.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google https://fundingchoicesmessages.google.com https://*.fundingchoicesmessages.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
